<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SmartLife SACCO</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .auth-container { max-width: 500px; margin: 60px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); border-top: 5px solid #F58220; }
        .auth-container h2 { color: #1a2b5e; text-align: center; margin-bottom: 20px; }
        .toggle-link { text-align: center; display: block; margin-top: 15px; color: #00AEEF; cursor: pointer; font-weight: bold; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    </style>
</head>
<body>
    <header><div class="logo"><img src="logo.png" alt="Logo"></div><nav><ul><li><a href="index.html">← Back</a></li></ul></nav></header>

    <div class="auth-container">
        <!-- LOGIN -->
        <div id="loginSection">
            <h2>Member Login</h2>
            <form id="loginForm">
                <div class="form-group"><label>Email</label><input type="email" id="loginEmail" required></div>
                <div class="form-group"><label>Password</label><input type="password" id="loginPassword" required></div>
                <button type="submit" class="btn-primary" style="width: 100%;">Login</button>
            </form>
            <span class="toggle-link" onclick="showSection('register')">Don't have an account? Register here</span>
        </div>

        <!-- REGISTER -->
        <div id="registerSection" style="display: none;">
            <h2>Create Account</h2>
            <form id="registerForm">
                <div class="form-group"><label>Full Name</label><input type="text" id="regName" required></div>
                <div class="grid-2">
                    <div class="form-group"><label>Email</label><input type="email" id="regEmail" required></div>
                    <div class="form-group"><label>Phone</label><input type="tel" id="regPhone" required></div>
                </div>
                <div class="grid-2">
                    <div class="form-group"><label>TSC No</label><input type="text" id="regTsc" required></div>
                    <div class="form-group"><label>Member No</label><input type="text" id="regMemberNo" required></div>
                </div>
                <div class="grid-2">
                    <div class="form-group"><label>Year Employed</label><input type="number" id="regYearEmp" required></div>
                    <div class="form-group"><label>Year Born</label><input type="number" id="regYearBorn" required></div>
                </div>
                <div class="form-group"><label>Current Shares (KES)</label><input type="number" id="regShares" required></div>
                <div class="grid-2">
                    <div class="form-group"><label>Basic Salary (KES)</label><input type="number" id="regBasicSalary" required></div>
                    <div class="form-group"><label>Net Salary (KES)</label><input type="number" id="regNetSalary" required></div>
                </div>
                <div class="form-group" style="margin-top: 15px;"><label>Password</label><input type="password" id="regPassword" required></div>
                <button type="submit" class="btn-primary" style="width: 100%;">Register</button>
            </form>
            <span class="toggle-link" onclick="showSection('login')">Already have an account? Login</span>
        </div>

        <!-- OTP -->
        <div id="verifySection" style="display: none;">
            <h2>Verify Phone</h2>
            <p style="text-align: center; margin-bottom: 20px;">OTP sent to <strong id="verifyPhoneDisplay"></strong></p>
            <form id="verifyForm">
                <div class="form-group"><label>Enter OTP</label><input type="text" id="verifyCode" style="font-size: 1.5rem; text-align: center; letter-spacing: 10px;" maxlength="6" required></div>
                <button type="submit" class="btn-primary" style="width: 100%;">Verify</button>
            </form>
        </div>
    </div>

    <script>
        function showSection(name) {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('registerSection').style.display = 'none';
            document.getElementById('verifySection').style.display = 'none';
            document.getElementById(name + 'Section').style.display = 'block';
        }

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const phone = document.getElementById('regPhone').value;
            const data = {
                name: document.getElementById('regName').value, email: document.getElementById('regEmail').value, phone: phone, password: document.getElementById('regPassword').value,
                tscNo: document.getElementById('regTsc').value, memberNo: document.getElementById('regMemberNo').value, yearEmployed: document.getElementById('regYearEmp').value,
                yearBorn: document.getElementById('regYearBorn').value, shares: document.getElementById('regShares').value, basicSalary: document.getElementById('regBasicSalary').value, netSalary: document.getElementById('regNetSalary').value
            };
            const res = await fetch('/api/register', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
            const result = await res.json();
            if (res.ok) { alert(result.message); document.getElementById('verifyPhoneDisplay').innerText = phone; showSection('verify'); } else { alert(result.error); }
        });

        document.getElementById('verifyForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const phone = document.getElementById('verifyPhoneDisplay').innerText;
            const code = document.getElementById('verifyCode').value;
            const res = await fetch('/api/verify-otp', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ phone, code }) });
            const result = await res.json();
            if (res.ok) { alert(result.message); showSection('login'); } else { alert(result.error); }
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = { email: document.getElementById('loginEmail').value, password: document.getElementById('loginPassword').value };
            const res = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
            const result = await res.json();
            if (res.ok) { localStorage.setItem('user', JSON.stringify(result.user)); alert("Login successful!"); window.location.href = "index.html"; } else { alert(result.error); }
        });
    </script>
</body>
</html>
